<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots project" />
    <meta name="author" content="Zack Ziakas" />
    <meta name="keywords" content="HTML,CSS,JavaScript" />

    <link rel="icon" href="./images/favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <!-- Header -->
      <header class="header">
        <img
          src="<%= require('./images/Logo-spots.svg') %>"
          alt="Spots logo"
          class="header__logo"
        />
      </header>

      <!-- Main Content -->
      <main class="content">
        <!-- Profile Section -->
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <!-- Button that opens avatar modal -->
            <button class="profile__avatar-btn" type="button">
              <img
                src="<%= require('./images/Edit-icon.svg') %>"
                alt=""
                class="profile__avatar-icon"
              />
            </button>

            <!-- Avatar image updated from API -->
            <img
              src="./images/avatar.jpg"
              alt="Current user's avatar"
              class="profile__avatar"
            />
          </div>

          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%= require('./images/Edit-icon.svg') %>"
                alt=""
                class="profile__edit-icon"
              />
              Edit Profile
            </button>
          </div>

          <button type="button" class="profile__add-btn">
            <img
              src="<%= require('./images/Plus-icon.svg') %>"
              alt=""
              class="profile__add-icon"
            />
            New Post
          </button>
        </section>

        <!-- Cards Section -->
        <section class="cards page__section">
          <ul class="cards__list">
            <!-- Card template -->
            <template id="card-template">
              <li class="card">
                <button
                  class="card__delete-button"
                  type="button"
                  aria-label="Delete card"
                ></button>
                <img
                  src="./images/State=Default.svg"
                  alt=""
                  class="card__image"
                />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <div class="card__like-wrapper">
                    <button
                      type="button"
                      class="card__like-btn"
                      aria-label="Like card"
                    ></button>
                    <!-- Optional like count, JS will use if present -->
                    <!-- <span class="card__like-count">0</span> -->
                  </div>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <p class="footer__text">© 2025 Spots. All rights reserved.</p>
      </footer>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal" id="edit-profile-modal">
      <div
        class="modal__container"
        role="dialog"
        aria-modal="true"
        aria-labelledby="edit-profile-title"
      >
        <button
          type="button"
          class="modal__close-btn"
          aria-label="Close"
        ></button>
        <h2 class="modal__title" id="edit-profile-title">Edit Profile</h2>

        <form class="modal__form" novalidate>
          <label for="profile-name-input" class="modal__label">
            Name
            <input
              id="profile-name-input"
              type="text"
              class="modal__input"
              name="name"
              placeholder="Type your name"
              minlength="2"
              maxlength="40"
              required
              aria-describedby="profile-name-input-error"
            />
            <span class="modal__error" id="profile-name-input-error"></span>
          </label>

          <label for="profile-description-input" class="modal__label">
            Description
            <input
              id="profile-description-input"
              type="text"
              class="modal__input"
              name="about"
              placeholder="Describe yourself"
              minlength="2"
              maxlength="200"
              required
              aria-describedby="profile-description-input-error"
            />
            <span
              class="modal__error"
              id="profile-description-input-error"
            ></span>
          </label>

          <button type="submit" class="modal__button">Save</button>
        </form>
      </div>
    </div>

    <!-- New Post Modal -->
    <div class="modal" id="new-post-modal">
      <div
        class="modal__container"
        role="dialog"
        aria-modal="true"
        aria-labelledby="new-post-title"
      >
        <button
          type="button"
          class="modal__close-btn"
          aria-label="Close"
        ></button>
        <h2 class="modal__title" id="new-post-title">New Post</h2>

        <form class="modal__form" novalidate>
          <label for="card-image-input" class="modal__label">
            Image Link
            <input
              id="card-image-input"
              type="url"
              class="modal__input"
              name="link"
              placeholder="Place a link to picture"
              required
              aria-describedby="card-image-input-error"
            />
            <span class="modal__error" id="card-image-input-error"></span>
          </label>

          <label for="card-caption-input" class="modal__label">
            Caption
            <input
              id="card-caption-input"
              type="text"
              class="modal__input"
              name="name"
              placeholder="Type your caption"
              minlength="2"
              maxlength="30"
              required
              aria-describedby="card-caption-input-error"
            />
            <span class="modal__error" id="card-caption-input-error"></span>
          </label>

          <button type="submit" class="modal__button">Save</button>
        </form>
      </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal modal_type_preview" id="preview-modal">
      <div
        class="modal__image-container"
        role="dialog"
        aria-modal="true"
        aria-labelledby="preview-caption"
      >
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_preview"
          aria-label="Close"
        ></button>
        <img src="#" alt="Preview image" class="modal__image" />
        <p class="modal__caption" id="preview-caption"></p>
      </div>
    </div>

    <!-- Avatar Modal -->
    <div class="modal" id="avatar-modal">
      <div
        class="modal__container"
        role="dialog"
        aria-modal="true"
        aria-labelledby="edit-avatar-title"
      >
        <button
          type="button"
          class="modal__close-btn"
          aria-label="Close"
        ></button>
        <h2 class="modal__title" id="edit-avatar-title">Edit avatar</h2>

        <form class="modal__form" novalidate>
          <label for="profile-avatar-input" class="modal__label">
            Avatar URL
            <input
              id="profile-avatar-input"
              type="url"
              class="modal__input"
              name="avatar"
              placeholder="Paste a link to your avatar"
              required
              aria-describedby="profile-avatar-input-error"
            />
            <span class="modal__error" id="profile-avatar-input-error"></span>
          </label>

          <button type="submit" class="modal__button">Save</button>
        </form>
      </div>
    </div>

    <!-- Delete Card Modal -->
    <div class="modal" id="delete-modal">
      <div
        class="modal__container"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-title"
      >
        <button
          type="button"
          class="modal__close-btn"
          aria-label="Close"
        ></button>
        <h2 class="modal__title" id="delete-title">
          Are you sure you want to delete this image?
        </h2>

        <form class="modal__form" id="delete-form">
          <button type="submit" class="modal__button">Delete</button>
          <button type="button" class="modal__button modal__button_type_cancel">
            Cancel
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
